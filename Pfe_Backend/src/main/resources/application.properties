spring.application.name=Pfe_Backend
spring.application.version=2.0.20
#mongo
spring.mongodb.uri=mongodb://localhost:27017/pfe_db

#jwt
jwt.secret=YOUR_JWT_SECRET_HERE
jwt.expiration=86400000

#email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#files
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

stripe.secret.key=YOUR_STRIPE_SECRET_KEY_HERE
stripe.publishable.key=YOUR_STRIPE_PUBLISHABLE_KEY_HERE
app.platform.fee.percent=0.20
