# Recommendation System Configuration

# Python API URL
recommendation.api.url=http://localhost:5000

# Enable async processing for refresh operations
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# RestTemplate timeout settings (in milliseconds)
recommendation.api.connection-timeout=5000
recommendation.api.read-timeout=30000
